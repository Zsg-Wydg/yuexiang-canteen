# Render 云端部署配置（Render 免费套餐，无需信用卡）
# 文档: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: yuexiang-canteen
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm --prefix frontend run build
    startCommand: node backend/src/server.js
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"            # 项目使用 Node 内置 node:sqlite，需要 Node 24
      - key: JWT_SECRET
        generateValue: true    # Render 自动生成随机密钥，无需手写
